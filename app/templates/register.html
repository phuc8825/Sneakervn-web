{% extends 'base.html' %}
{% block title %}Đăng ký - SaaS PoS{% endblock %}

{% block head %}
<script>
function toggleTenantOption() {
    const option = document.querySelector('input[name="tenant_option"]:checked').value;
    document.getElementById('existing-tenant').style.display = option === 'existing' ? 'block' : 'none';
    document.getElementById('new-tenant').style.display = option === 'new' ? 'block' : 'none';
}
</script>
{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-zinc-100 py-16 px-4">
    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold">Tạo tài khoản</h2>
            <p class="text-zinc-500 mt-2">Tham gia SaaS PoS Platform</p>
        </div>

        <form method="POST" action="/auth/register" class="space-y-4">
            <!-- User Information -->
            <input type="text" name="name" placeholder="Họ và tên" required
                   class="w-full border border-zinc-200 p-4 rounded-2xl focus:outline-none focus:border-black transition text-sm">
            <input type="email" name="email" placeholder="Email" required
                   class="w-full border border-zinc-200 p-4 rounded-2xl focus:outline-none focus:border-black transition text-sm">
            <input type="tel" name="phone" placeholder="Số điện thoại (tùy chọn)"
                   class="w-full border border-zinc-200 p-4 rounded-2xl focus:outline-none focus:border-black transition text-sm">
            <input type="password" name="password" placeholder="Mật khẩu (ít nhất 6 ký tự)" required minlength="6"
                   class="w-full border border-zinc-200 p-4 rounded-2xl focus:outline-none focus:border-black transition text-sm">

            <!-- Tenant Selection -->
            <div class="bg-zinc-50 rounded-2xl p-4 mt-6">
                <p class="text-sm font-semibold text-zinc-700 mb-3">Chọn cửa hàng:</p>
                <label class="flex items-center mb-3 cursor-pointer">
                    <input type="radio" name="tenant_option" value="new" checked onclick="toggleTenantOption()"
                           class="w-4 h-4">
                    <span class="ml-3 text-sm">Tạo cửa hàng mới</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="tenant_option" value="existing" onclick="toggleTenantOption()"
                           class="w-4 h-4">
                    <span class="ml-3 text-sm">Tham gia cửa hàng hiện có</span>
                </label>
            </div>

            <!-- New Tenant Form -->
            <div id="new-tenant" class="space-y-3 mt-4">
                <p class="text-xs font-semibold text-zinc-600">Thông tin cửa hàng:</p>
                <input type="text" name="shop_name" placeholder="Tên cửa hàng *" required
                       class="w-full border border-zinc-200 p-4 rounded-2xl focus:outline-none focus:border-black transition text-sm">
                <input type="email" name="shop_email" placeholder="Email cửa hàng *" required
                       class="w-full border border-zinc-200 p-4 rounded-2xl focus:outline-none focus:border-black transition text-sm">
                <input type="tel" name="shop_phone" placeholder="Số điện thoại cửa hàng"
                       class="w-full border border-zinc-200 p-4 rounded-2xl focus:outline-none focus:border-black transition text-sm">
                <textarea name="shop_address" placeholder="Địa chỉ cửa hàng" rows="2"
                          class="w-full border border-zinc-200 p-4 rounded-2xl focus:outline-none focus:border-black transition text-sm resize-none"></textarea>
            </div>

            <!-- Existing Tenant Form -->
            <div id="existing-tenant" style="display:none;" class="space-y-3 mt-4">
                <p class="text-xs font-semibold text-zinc-600">Chọn cửa hàng:</p>
                <select name="tenant_id" class="w-full border border-zinc-200 p-4 rounded-2xl focus:outline-none focus:border-black transition text-sm">
                    <option value="">-- Chọn cửa hàng --</option>
                    {% for tenant in tenants %}
                    <option value="{{ tenant.id }}">{{ tenant.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit"
                    class="w-full bg-black text-white py-4 rounded-2xl font-semibold text-base hover:bg-zinc-800 transition">
                Đăng ký
            </button>
        </form>

        <p class="text-center mt-6 text-sm text-zinc-500">
            Đã có tài khoản?
            <a href="/auth/login" class="text-black font-semibold hover:underline">Đăng nhập</a>
        </p>
    </div>
</div>
{% endblock %}
